[project]
name = "mario-isaac"
version = "0.1.0"
description = "A Binding of Isaac-like built with pygame"
requires-python = ">=3.13"
dependencies = [
	"pygame>=2.6",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
	"ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mario_isaac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
